[build-system]
requires = ["scikit-build-core>=0.4.3", "nanobind>=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "tt-mgmt"
version = "0.1.0"
description = "Tenstorrent Management"
requires-python = ">=3.8"
readme = "README.md"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
tt-mgmt = "tt_mgmt.cli:main"
tt-mgmtd = "tt_mgmt.daemon:main"

[tool.scikit-build]
minimum-version = "0.4"
build-dir = "build/{wheel_tag}"
